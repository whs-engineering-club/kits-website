<!doctype html>
<meta charset="utf-8">
<title>Model preview</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/controls/":"./vendor/"}}</script>
<style>html,body{margin:0;height:100%;background:#191918}#v{position:relative;width:100vw;height:100vh}</style>
<div id="v" class="viewer"></div>
<script type="module">
  // Dev page: preview.html?m=<kit>/<project>&step=<n>
  import { mountViewer } from './viewer.js';
  const q = new URLSearchParams(location.search);
  const [kit, project] = (q.get('m') || 'ece/led-circuit').split('/');
  const models = (await import(`./models/${kit}.js`)).default;
  window.viewer = mountViewer(document.getElementById('v'), models[project], { step: Number(q.get('step') ?? 1), autoRotate: false, capture: true });
  window.ready = true;
</script>
